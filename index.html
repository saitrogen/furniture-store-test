<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Furniture Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f0eb; color: #2d2d2d; }
    header { background: #3b2a1a; color: white; padding: 1.5rem 2rem; text-align: center; }
    header h1 { font-size: 2rem; letter-spacing: 1px; }
    header p { opacity: 0.8; margin-top: 0.3rem; }
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; padding: 1.5rem; }
    .filters button { padding: 0.5rem 1.2rem; border: 2px solid #3b2a1a; border-radius: 20px; background: white; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .filters button.active, .filters button:hover { background: #3b2a1a; color: white; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding: 1rem 2rem 3rem; max-width: 1200px; margin: 0 auto; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.08); transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 200px; object-fit: cover; background: #e8ddd0; }
    .card-body { padding: 1rem; }
    .card-body h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
    .card-body .price { color: #c0392b; font-weight: bold; font-size: 1.1rem; margin-bottom: 0.4rem; }
    .card-body .category { font-size: 0.75rem; background: #f0e8df; color: #3b2a1a; padding: 2px 8px; border-radius: 10px; display: inline-block; margin-bottom: 0.5rem; }
    .card-body p { font-size: 0.88rem; color: #666; margin-bottom: 1rem; }
    .wa-btn { display: block; text-align: center; background: #25D366; color: white; padding: 0.6rem; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.95rem; }
    .wa-btn:hover { background: #1ebe5d; }
    .img-dots { display: flex; gap: 6px; justify-content: center; padding: 8px 0 4px; }
    .img-dots span { width: 8px; height: 8px; border-radius: 50%; background: #ccc; cursor: pointer; }
    .img-dots span.active { background: #3b2a1a; }
    #loading { text-align: center; padding: 3rem; color: #888; }
  </style>
</head>
<body>
  <header>
    <h1>🪑 Furniture Store</h1>
    <p>Quality furniture — Browse &amp; connect directly</p>
  </header>
  <div class="filters" id="filters"><button class="active" onclick="filterProducts('all', this)">All</button></div>
  <div id="loading">Loading products...</div>
  <div id="grid"></div>

  <script>
    const REPO_OWNER = 'saitrogen';
    const REPO_NAME = 'furniture-store-test';
    const RAW_BASE = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/`;
    let allProducts = [];

    async function loadProducts() {
      const res = await fetch(RAW_BASE + 'products.json?t=' + Date.now());
      allProducts = await res.json();
      document.getElementById('loading').style.display = 'none';
      buildFilters();
      renderProducts(allProducts);
    }

    function buildFilters() {
      const cats = ['all', ...new Set(allProducts.map(p => p.category))];
      const f = document.getElementById('filters');
      f.innerHTML = cats.map((c, i) =>
        `<button class="${i===0?'active':''}" onclick="filterProducts('${c}', this)">${c==='all'?'All':c}</button>`
      ).join('');
    }

    function filterProducts(cat, btn) {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = document.getElementById('grid');
      if (!products.length) { grid.innerHTML = '<p style="text-align:center;color:#888">No products found.</p>'; return; }
      grid.innerHTML = products.map(p => {
        const imgs = p.images && p.images.length ? p.images : [''];
        const imgTags = imgs.map((src, i) =>
          `<img src="${src ? RAW_BASE + src : 'https://via.placeholder.com/280x200?text=No+Image'}" style="display:${i===0?'block':'none'}" data-idx="${i}" loading="lazy" />`
        ).join('');
        const dots = imgs.length > 1 ? `<div class="img-dots">${imgs.map((_,i) => `<span class="${i===0?'active':''}" onclick="switchImg(this,${i},'${p.id}')"></span>`).join('')}</div>` : '';
        const msg = encodeURIComponent(`Hi, I'm interested in ${p.name}`);
        return `<div class="card" id="card-${p.id}">
          <div style="position:relative">${imgTags}</div>
          ${dots}
          <div class="card-body">
            <span class="category">${p.category}</span>
            <h3>${p.name}</h3>
            <div class="price">${p.price}</div>
            <p>${p.description}</p>
            <a class="wa-btn" href="https://wa.me/${p.whatsapp}?text=${msg}" target="_blank">💬 WhatsApp Enquiry</a>
          </div>
        </div>`;
      }).join('');
    }

    function switchImg(dot, idx, id) {
      const card = document.getElementById('card-' + id);
      card.querySelectorAll('img').forEach((img, i) => img.style.display = i === idx ? 'block' : 'none');
      card.querySelectorAll('.img-dots span').forEach((s, i) => s.classList.toggle('active', i === idx));
    }

    loadProducts();
  </script>
</body>
</html>
