<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Furniture Store</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<header>
  <h1>🛋 Admin</h1>
  <div id="userInfo"></div>
</header>

<div id="loginSection" style="display:none">
  <h2>Admin Login</h2>
  <p>Sign in to manage products and images</p>
  <button class="btn btn-primary" onclick="showLogin()">🔐 Enter Token</button>
</div>

<div id="adminSection">

  <div id="status" class="status"></div>

  <!-- Add / Edit Form -->
  <div class="form-card" id="formCard">
    <h2 id="formTitle">➕ Add New Product</h2>

    <div class="form-row">
      <div>
        <label>Product ID <span style="color:#bbb;font-weight:400">(slug, no spaces — cannot change later)</span></label>
        <input id="pid" placeholder="teak-sofa-01" />
      </div>
      <div>
        <label>Product Name</label>
        <input id="pname" placeholder="Teak Wood Sofa" />
      </div>
    </div>

    <div class="form-row">
      <div>
        <label>Price</label>
        <input id="pprice" placeholder="₹18,000" />
      </div>
      <div>
        <label>Category</label>
        <input id="pcat" placeholder="Sofa" />
      </div>
    </div>

    <div class="form-row full">
      <div>
        <label>WhatsApp Number (with country code)</label>
        <input id="pwa" placeholder="919876543210" />
      </div>
    </div>

    <div class="form-row full">
      <div>
        <label>Description</label>
        <textarea id="pdesc" placeholder="Short product description"></textarea>
      </div>
    </div>

    <!-- Existing images shown only in edit mode -->
    <div id="existingImgs"></div>

    <div class="form-row full" style="margin-top:0.75rem">
      <div>
        <label>Add Images</label>
        <input type="file" id="pimages" accept="image/*" multiple onchange="previewNewImages(this)" />
        <div id="newImgPreview"></div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-success" id="submitBtn" onclick="submitForm()">✅ Add Product</button>
      <button class="btn btn-outline" id="cancelBtn" onclick="cancelEdit()" style="display:none;background:#888;color:white">✕ Cancel Edit</button>
    </div>
  </div>

  <!-- Product List -->
  <div class="form-card">
    <h2>📦 Products</h2>
    <div class="product-list" id="productList">Loading...</div>
  </div>

</div>

<script src="./config.js"></script>
<script src="./js/github-api.js"></script>
<script src="./js/admin.js"></script>
</body>
</html>
